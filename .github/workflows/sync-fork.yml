name: Sync fork with upstream

# Pulls new commits from x1xhlol/system-prompts-and-models-of-ai-tools
# on the 1st of every month (and on demand from the Actions tab).
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
